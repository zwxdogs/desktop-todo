<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌面待办 spike</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="hdr" data-tauri-drag-region>
    <div id="hdr-title" data-tauri-drag-region>桌面待办 <span class="tag">tauri spike</span></div>
    <div id="hdr-btns">
      <button id="btn-demo" class="hbtn" title="Tk 做不到的视觉">Aa</button>
      <button id="btn-close" class="hbtn" title="关闭">✕</button>
    </div>
  </header>

  <main id="list" role="list"></main>

  <footer id="statusbar">
    <span id="status-text">启动中…</span>
    <span id="ime-state"></span>
  </footer>

  <!-- Tk 8.6 做不到的视觉演示：AA 圆角卡片 + 柔和阴影 + 背景模糊 + 平滑过渡 -->
  <div id="demo-overlay" class="hidden">
    <div id="demo-card">
      <h2>这是 Tk 8.6 做不到的</h2>
      <ul>
        <li>逐像素 alpha 的 AA 圆角（本卡片 16px 圆角 + 真阴影）</li>
        <li>柔和多层阴影（0 8px 32px rgba(0,0,0,.18)）</li>
        <li>backdrop-filter 背景模糊（本卡片背后的列表正在被模糊）</li>
        <li>平滑过渡与弹性动效（打开本卡片的缩放+淡入）</li>
        <li>粘性半透明顶栏（滚动时列表从顶栏下模糊穿过）</li>
      </ul>
      <button id="btn-demo-close">知道了</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
